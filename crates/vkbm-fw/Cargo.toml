[package]
name = "vkbm-fw"
description = "versa-kbm RP2040 firmware: composite HID keyboard + absolute/relative mouse + vendor control channel."
version = "0.5.0"
edition = "2024"
publish = false

# Standalone crate (excluded from the workspace): thumbv6m target, own
# lockfile and target dir, picotool runner. Lints mirror the workspace set.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "warn"

[features]
default = []
# Adds a CDC-ACM bench channel speaking `vkbm_proto::line` ASCII commands.
# CDC adds two USB interfaces (comm + data) on top of the four HID ones
# (keyboard, absolute mouse, relative mouse, vendor); the default
# `max-interface-count-4` would panic at builder time.
dev-cdc = ["embassy-usb/max-interface-count-6"]

[dependencies]
embassy-executor = { version = "0.9.0", features = [
    "arch-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-rp = { version = "0.8.0", features = [
    "defmt",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "rp2040",
] }
embassy-time = { version = "0.5.0", features = [
    "defmt",
    "defmt-timestamp-uptime",
] }
embassy-usb = { version = "0.5.1", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-sync = "0.7"

cortex-m = "0.7.6"
cortex-m-rt = "0.7.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
usbd-hid = "0.8.1"

vkbm-proto = { path = "../vkbm-proto" }

[profile.dev]
# The USB peripheral's setup-packet timing can't keep up at opt-level 0:
# the board boots with no device enumerating. Optimize dev builds too;
# overflow checks and debug symbols stay on (dev defaults).
opt-level = 2

[profile.release]
# Enable generation of debug symbols even on release builds.
debug = true
