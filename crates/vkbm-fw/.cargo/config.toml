[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# picotool is not on PATH here; adjust if yours moves or gets installed.
runner = 'C:\Tools\picotool\picotool.exe load --update --verify --execute -t elf'

[build]
target = "thumbv6m-none-eabi" # Cortex-M0 and Cortex-M0+.

[env]
DEFMT_LOG = "info"
