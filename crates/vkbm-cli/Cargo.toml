[package]
name = "vkbm-cli"
description = "versa-kbm companion CLI: find the device, handshake, manual actuation."
version.workspace = true
edition.workspace = true
publish = false

# The tool is documented and distributed as `vkbm`; name the binary
# accordingly instead of after the package.
[[bin]]
name = "vkbm"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hidapi = "2"
vkbm-proto = { path = "../vkbm-proto" }
