[workspace]
resolver = "3"
members = ["crates/vkbm-proto", "crates/vkbm-cli"]
# The firmware is a standalone crate (own toolchain target, own lockfile,
# own target dir), excluded from the workspace.
exclude = ["crates/vkbm-fw"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.87"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "deny"
string_slice = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
strip = true
